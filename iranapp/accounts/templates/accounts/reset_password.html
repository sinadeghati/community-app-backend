<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset your password</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      line-height: 1.5;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f6f8;
      color: #111;
    }
    main {
      width: min(100%, 28rem);
      margin: 1.5rem;
      padding: 1.5rem;
      background: #fff;
      border: 1px solid #d9dee5;
      border-radius: 0.75rem;
      box-shadow: 0 8px 24px rgba(16, 24, 40, 0.08);
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.5rem;
    }
    p {
      margin: 0 0 1rem;
      color: #4b5563;
    }
    label {
      display: block;
      margin-bottom: 0.35rem;
      font-weight: 600;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 1rem;
      padding: 0.65rem 0.75rem;
      border: 1px solid #c7ced8;
      border-radius: 0.5rem;
      font: inherit;
    }
    button {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 0;
      border-radius: 0.5rem;
      background: #0f766e;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }
    #message {
      margin-top: 1rem;
      min-height: 1.25rem;
      font-size: 0.95rem;
    }
    #message.error { color: #b42318; }
    #message.success { color: #027a48; }
  </style>
</head>
<body>
  <main>
    <h1>Reset your password</h1>
    <p>Choose a new password for your Korook account.</p>

    <form id="reset-form" novalidate>
      <label for="new_password">New password</label>
      <input id="new_password" name="new_password" type="password" autocomplete="new-password" required>

      <label for="confirm_password">Confirm password</label>
      <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required>

      <button type="submit" id="submit-btn">Reset password</button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>
  </main>

  <script>
    (function () {
      const uid = "{{ uid|escapejs }}";
      const token = "{{ token|escapejs }}";
      const confirmApiPath = "{{ confirm_api_path|escapejs }}";
      const form = document.getElementById("reset-form");
      const message = document.getElementById("message");
      const submitBtn = document.getElementById("submit-btn");

      function showMessage(text, type) {
        message.textContent = text;
        message.className = type || "";
      }

      function formatErrors(data) {
        if (!data || typeof data !== "object") {
          return "Unable to reset password. Please try again.";
        }
        if (data.message) {
          return data.message;
        }
        const parts = [];
        for (const [field, value] of Object.entries(data)) {
          const text = Array.isArray(value) ? value.join(" ") : String(value);
          parts.push(field + ": " + text);
        }
        return parts.join(" ") || "Unable to reset password. Please try again.";
      }

      if (!uid || !token) {
        showMessage("This reset link is invalid or incomplete. Request a new password reset email.", "error");
        form.hidden = true;
        return;
      }

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        showMessage("");

        const newPassword = document.getElementById("new_password").value;
        const confirmPassword = document.getElementById("confirm_password").value;

        if (newPassword !== confirmPassword) {
          showMessage("New password and confirmation do not match.", "error");
          return;
        }

        submitBtn.disabled = true;

        try {
          const response = await fetch(confirmApiPath, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              uid: uid,
              token: token,
              new_password: newPassword,
              confirm_password: confirmPassword,
            }),
          });

          const data = await response.json().catch(function () { return {}; });

          if (!response.ok) {
            showMessage(formatErrors(data), "error");
            submitBtn.disabled = false;
            return;
          }

          form.hidden = true;
          showMessage(data.message || "Password reset successfully. You can close this page and sign in with your new password.", "success");
        } catch (error) {
          showMessage("Network error. Check your connection and try again.", "error");
          submitBtn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
